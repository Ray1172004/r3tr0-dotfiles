# ==========================================
# R3TR0 HYPRLOCK - MINIMAL PURPLE
# ==========================================

general {
    hide_cursor = false
    ignore_empty_input = true
}

# FONDO DE PANTALLA
background {
    monitor =
    path = /home/YOUR_USER/Pictures/Wallpappers/wallpapers/Purple-clouds-car-headlights.jpg
    blur_passes = 2
    blur_size = 4
    brightness = 0.85
    contrast = 1.0
}

# HOSTNAME - SUPERIOR IZQUIERDA
label {
    monitor =
    text = cmd[update:60000] hostname
    color = rgba(231, 228, 244, 1.0)
    font_size = 17
    font_family = JetBrainsMono Nerd Font

    position = 35, -35
    halign = left
    valign = top
}

# FECHA - SUPERIOR DERECHA
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B %Y'
    color = rgba(231, 228, 244, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = -35, -40
    halign = right
    valign = top
}

# RELOJ
label {
    monitor =
    text = $TIME
    color = rgba(231, 228, 244, 1.0)
    font_size = 88
    font_family = JetBrainsMono Nerd Font

    position = 0, 130
    halign = center
    valign = center
}

# BIENVENIDA
label {
    monitor =
    text = Bienvenido de vuelta, $USER
    color = rgba(231, 228, 244, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, 40
    halign = center
    valign = center
}

# CONTRASEÑA
input-field {
    monitor =
    size = 330, 52
    outline_thickness = 2
    rounding = -1

    outer_color = rgba(180, 154, 255, 1.0)
    inner_color = rgba(17, 17, 27, 0.88)
    font_color = rgba(231, 228, 244, 1.0)

    check_color = rgba(180, 154, 255, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)

    dots_size = 0.16
    dots_spacing = 0.18
    dots_center = true

    fade_on_empty = false
    placeholder_text = <i>Introduce tu contraseña</i>
    fail_text = <i>Contraseña incorrecta</i>

    font_family = JetBrainsMono Nerd Font

    position = 0, -38
    halign = center
    valign = center
}

# MUSICA - INFERIOR IZQUIERDA
label {
    monitor =
    text = cmd[update:3000] /home/YOUR_USER/.config/hypr/scripts/lock-music.sh
    color = rgba(231, 228, 244, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = 35, 35
    halign = left
    valign = bottom
}

# BOTON DE APAGADO - INFERIOR DERECHA
label {
    monitor =
    text = ⏻
    color = rgba(231, 228, 244, 1.0)
    font_size = 26
    font_family = DejaVu Sans

    position = -38, 30
    halign = right
    valign = bottom

    onclick = systemctl poweroff
}
