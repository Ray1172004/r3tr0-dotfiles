# ==========================================
# R3TR0 KITTY - MINIMAL PURPLE
# ==========================================

# FUENTE
font_family JetBrainsMono Nerd Font
font_size 11.5

# CURSOR
cursor #c4adff
cursor_shape beam
cursor_blink_interval 0.6

# FONDO Y TEXTO
background #11111b
foreground #eeeaf8

# TRANSPARENCIA
background_opacity 0.72
dynamic_background_opacity yes

# ESPACIADO
window_padding_width 12

# DECORACIONES
hide_window_decorations yes
draw_minimal_borders yes
active_border_color #b49aff
inactive_border_color #38304d

# SELECCION
selection_background #64528d
selection_foreground #ffffff

# COLORES ANSI
color0 #4b455d
color1 #ff829d
color2 #a6e3a1
color3 #f9e2af
color4 #9bbcff
color5 #d6adff
color6 #94e2d5
color7 #e7e4f4

color8 #89829f
color9 #ff9bb2
color10 #b8f0b4
color11 #ffe6ad
color12 #b3ccff
color13 #e2c2ff
color14 #b1f0e6
color15 #ffffff

# SCROLL
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# ENLACES
url_color #b49aff
url_style curly

# SONIDOS
enable_audio_bell no

# ATAJOS
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
